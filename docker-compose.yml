name: veritas

services:
  backend:
    image: epam-veritas-backend:1.0
    container_name: veritas-backend
    build:
      context: .
      dockerfile: Dockerfile
    gpus: all
    shm_size: "2gb"
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: "/home/veritas/.cache/huggingface"
      TORCH_HOME: "/home/veritas/.cache/torch"
      XDG_CACHE_HOME: "/home/veritas/.cache"
      EPAM_DATA_ROOT: "/app"
      EPAM_SHARED_DATA_ROOT: "/app/shared-data"
      EPAM_AUTH_SECRET_KEY: "${EPAM_AUTH_SECRET_KEY:-veritas-local-dev-secret-change-me}"
      EPAM_ENCRYPTION_SECRET_KEY: "${EPAM_ENCRYPTION_SECRET_KEY:-veritas-local-dev-encryption-key-change-me}"
      EPAM_BACKEND_PORT: "8000"
      EPAM_SERVER_HOST: "0.0.0.0"
      EPAM_SERVER_PORT: "8000"
      EPAM_SUMMARIZATION_OLLAMA_BASE_URL: "${EPAM_SUMMARIZATION_OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      EPAM_SUMMARIZATION_OLLAMA_MODEL: "${EPAM_SUMMARIZATION_OLLAMA_MODEL:-gemma4:26b}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-0}"
      HF_DATASETS_OFFLINE: "${HF_DATASETS_OFFLINE:-0}"
      PYANNOTE_METRICS_ENABLED: "${PYANNOTE_METRICS_ENABLED:-0}"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    ports:
      - "127.0.0.1:${EPAM_BACKEND_PORT:-8765}:8000"
    volumes:
      - veritas-data:/app/data
      - veritas-shared-data:/app/shared-data
      - veritas-hf-cache:/home/veritas/.cache/huggingface
      - veritas-torch-cache:/home/veritas/.cache/torch
      - veritas-ct2-cache:/home/veritas/.cache/ctranslate2
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - veritas-net

  frontend:
    image: epam-veritas-frontend:1.0
    container_name: veritas-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      EPAM_FRONTEND_PORT: "5173"
      EPAM_BACKEND_HOST: "backend"
      EPAM_BACKEND_PORT: "8000"
    ports:
      - "127.0.0.1:${EPAM_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - veritas-net

networks:
  veritas-net:
    driver: bridge

volumes:
  veritas-data:
  veritas-shared-data:
  veritas-hf-cache:
  veritas-torch-cache:
  veritas-ct2-cache:
